name: Rollback Prod

# Points `prod` back at a commit a previous run archived.
#
# The outgoing (bad) commit is archived on the way out, exactly like a
# promotion, so a rollback is itself reversible and the backup tag list stays a
# complete history of every state prod has been in.
#
# This does not deploy. Run "Deploy Prod" afterwards to apply the restored
# commit — until you do, prod is still running the bad build.
#
# All the mechanics live in Archive and Move Ref. This file is just the prod
# arguments plus a dispatch button.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Backup tag to restore, e.g. backup/prod/2026-09-21T1947Z-98d4c86"
        required: true
      reason:
        description: "Why are you rolling back?"
        required: true

jobs:
  rollback:
    uses: ./.github/workflows/archive-and-move-ref.yml
    # Read-only: the PAT does the writing.
    permissions:
      contents: read
    # Reusable workflows do not see repo secrets unless passed.
    secrets:
      REF_MOVER_TOKEN: ${{ secrets.REF_MOVER_TOKEN }}
    with:
      target: prod
      allowed_source: refs/tags/backup/prod/*
      # Prefixed here rather than asking for the full ref: it keeps the
      # dispatch form short and guarantees the source resolves as a tag.
      source: refs/tags/${{ inputs.tag }}
