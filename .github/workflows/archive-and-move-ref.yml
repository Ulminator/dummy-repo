name: Archive and Move Ref

# Archives a branch as a tag, then force-moves it onto another ref.
#
# Callers supply the pair. Today that is only Promote Prod
# (target=prod, source=origin/main); rollback and the main catch-up are the
# same operation with different arguments.
#
# Pushes with a PAT, not GITHUB_TOKEN: moving a branch across differing
# `.github/workflows/` contents needs the `workflow` scope, which `permissions:`
# cannot grant. Unlike GITHUB_TOKEN, a PAT push does trigger other workflows.

on:
  workflow_call:
    secrets:
      REF_MOVER_TOKEN:
        description: "PAT with Contents + Workflows write on this repo"
        required: true
    inputs:
      target:
        description: "Branch to back up and then overwrite, e.g. prod"
        required: true
        type: string
      source:
        description: >-
          What the target becomes: a branch, tag, or SHA. Pass a fully
          qualified ref — a bare `main` resolves against local refs first,
          so it would pick the dispatch ref rather than origin's.
        required: true
        type: string
      allowed_source:
        # A caller that takes its source from a dispatch input is handing a
        # human a "point this branch anywhere" box. Each caller declares the
        # shape its source may have, and this workflow enforces it.
        description: "Glob the source must match, e.g. refs/tags/backup/prod/*"
        required: true
        type: string

jobs:
  archive-and-move-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only: the PAT does the writing, GITHUB_TOKEN just reads.
    permissions:
      contents: read
    # Keyed on the target, so everything contending over one branch shares a
    # lane while unrelated targets run in parallel. Never cancel: a cancel
    # could land between the backup tag and the push.
    concurrency:
      group: ref-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - name: Validate source
        env:
          SOURCE: ${{ inputs.source }}
          ALLOWED_SOURCE: ${{ inputs.allowed_source }}
        run: |
          # Separate from the glob: `*` in a case pattern matches `/` and `.`,
          # so refs/tags/backup/prod/../../heads/main would satisfy it.
          case "$SOURCE" in
            *..*)
              echo "::error::source may not contain '..': $SOURCE"
              exit 1
              ;;
          esac

          # Unquoted on purpose: ALLOWED_SOURCE is a glob, not a literal.
          case "$SOURCE" in
            $ALLOWED_SOURCE) ;;
            *)
              echo "::error::source \"$SOURCE\" does not match \"$ALLOWED_SOURCE\". Refusing to move ${{ inputs.target }}."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # persist-credentials (default true) stores this in git config, which
          # is what authenticates the pushes below.
          token: ${{ secrets.REF_MOVER_TOKEN }}
          # Load-bearing: only fetch-depth 0 uses the wildcard refspecs, which
          # is what puts origin/<target> and the backup tags in the clone.
          fetch-depth: 0

      - name: Resolve Refs
        id: refs
        env:
          TARGET: ${{ inputs.target }}
          SOURCE: ${{ inputs.source }}
        run: |
          # ^{commit} peels annotated tags, so a rollback's source resolves to
          # a commit rather than a tag object. No-op for a branch or a SHA.
          OLD=$(git rev-parse --verify "refs/remotes/origin/${TARGET}^{commit}")
          NEW=$(git rev-parse --verify "${SOURCE}^{commit}")

          if [ "$OLD" = "$NEW" ]; then
            echo "::notice::$TARGET is already at $NEW. Nothing to move."
            NOOP=true
          else
            NOOP=false
          fi

          {
            echo "old=$OLD"
            echo "new=$NEW"
            echo "noop=$NOOP"
          } >> "$GITHUB_OUTPUT"

      - name: Back up current target
        if: steps.refs.outputs.noop == 'false'
        env:
          TARGET: ${{ inputs.target }}
          OLD: ${{ steps.refs.outputs.old }}
        run: |
          # A failed Move leaves this tag behind, so a retry would archive the
          # same commit again. One tag per state, not per attempt.
          EXISTING=$(git tag --list "backup/${TARGET}/*" --points-at "$OLD" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "::notice::$OLD is already archived as $EXISTING"
            exit 0
          fi

          TAG="backup/${TARGET}/$(date -u +%Y-%m-%dT%H%MZ)-${OLD:0:7}"
          git tag "$TAG" "$OLD"
          git push origin "refs/tags/$TAG"

      - name: Move
        if: steps.refs.outputs.noop == 'false'
        env:
          TARGET: ${{ inputs.target }}
          OLD: ${{ steps.refs.outputs.old }}
          NEW: ${{ steps.refs.outputs.new }}
        run: |
          # The lease pins the target to the commit we read in Resolve Refs, so
          # if anything moved it since, this is rejected rather than clobbering.
          git push --force-with-lease="${TARGET}:${OLD}" \
            origin "${NEW}:refs/heads/${TARGET}"
