name: Promote Prod

# Moves the `prod` branch to whatever `main` currently points at, after tagging
# the outgoing prod commit so the previous state is always recoverable.
#
# Dispatch-only on purpose: promotion is a deliberate act with a run record,
# rather than a force-push from someone's laptop.
#
# This does not deploy. Run "Deploy Prod" afterwards to apply the promoted
# commit. Nothing listens on push today, but the worker pushes with a PAT, so
# that is convention rather than a guarantee.
#
# All the mechanics live in Archive and Move Ref. This file is just the prod
# arguments plus a dispatch button.

on:
  workflow_dispatch:

jobs:
  promote:
    uses: ./.github/workflows/archive-and-move-ref.yml
    # Read-only: the PAT does the writing.
    permissions:
      contents: read
    # Reusable workflows do not see repo secrets unless passed.
    secrets:
      REF_MOVER_TOKEN: ${{ secrets.REF_MOVER_TOKEN }}
    with:
      target: prod
      allowed_source: refs/remotes/origin/main
      source: refs/remotes/origin/main
